[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boostylib"
version = "1.1.0"
description = "Async Python library for Boosty.to API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "boostylib contributors" },
]
keywords = ["boosty", "api", "async", "donations", "subscriptions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.5",
    "mypy>=1.11",
    "chutils>=3.2.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Repository = "https://github.com/BazZziliuS/boostylib"

[tool.hatch.build.targets.wheel]
packages = ["src/boostylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (models, builders, pure logic)",
    "integration: Integration tests with mocked HTTP",
    "e2e: End-to-end tests against real Boosty API",
]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src/boostylib"]
branch = true

[tool.coverage.report]
fail_under = 65
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = false

[tool.chutils.ai-lint]
strict = false
exclude_rules = [
    "ChutilsIntegrationRule",
    "APIMapRule",
    "APIMapHashRule",
    "FileDependencySyncRule",
    "EnvSyncRule",
]
ignore = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "tests",
    "site",
    "docs",
    "TECHNICAL_SPEC.md",
]
